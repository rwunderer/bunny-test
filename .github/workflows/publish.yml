name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys serialize across every ref; cancelling mid-upload would
# leave a half-written deploy directory behind.
concurrency:
  group: bunny-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # records the deploy in the repo's Environments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # Disable automatic npm caching if not required

      - run: npm install -g bnycdn

      - run: |
          bnycdn key set default $secrets.BUNNYNET_API_KEY
          bnycdn key set capridesk $secrets.BUNNYNET_API_STORAGE_KEY --type=storages
          bnycdn cp -R -s capridesk ./dist /capridesk/
          bnycdn pz purge -t capridesk
